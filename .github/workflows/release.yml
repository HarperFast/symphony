name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build – ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            artifact: symphony.linux-x64-gnu.node

          - target: x86_64-unknown-linux-musl
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            artifact: symphony.linux-x64-musl.node

          - target: aarch64-unknown-linux-gnu
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            artifact: symphony.linux-arm64-gnu.node

          - target: aarch64-unknown-linux-musl
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            artifact: symphony.linux-arm64-musl.node

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build (${{ matrix.target }})
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.image }}
          options: >-
            -v ${{ github.workspace }}:/build
            -v $HOME/.cargo/registry:/root/.cargo/registry
            -v $HOME/.cargo/git:/root/.cargo/git
            -w /build
          run: |
            set -e
            npm ci
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              rustup target add aarch64-unknown-linux-musl
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
              export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
            fi
            npm run build -- --target ${{ matrix.target }}
            strip --strip-unneeded ${{ matrix.artifact }} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts
        run: npx napi artifacts --dir artifacts --dist npm

      - name: Compile TypeScript
        run: tsc -p tsconfig.json

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
