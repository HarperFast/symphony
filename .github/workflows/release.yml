name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-linux:
    name: Build – ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            artifact: symphony.linux-x64-gnu.node

          - target: x86_64-unknown-linux-musl
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            artifact: symphony.linux-x64-musl.node

          - target: aarch64-unknown-linux-gnu
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            artifact: symphony.linux-arm64-gnu.node

          - target: aarch64-unknown-linux-musl
            image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            artifact: symphony.linux-arm64-musl.node

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build (${{ matrix.target }})
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.image }}
          options: >-
            -v ${{ github.workspace }}:/build
            -v ${{ env.HOME }}/.cargo/registry:/usr/local/cargo/registry
            -v ${{ env.HOME }}/.cargo/git:/usr/local/cargo/git
            -w /build
          run: |
            set -e
            rustup update stable
            npm ci
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              rustup target add aarch64-unknown-linux-musl
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
              export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
            fi
            npm run build -- --target ${{ matrix.target }}
            strip --strip-unneeded ${{ matrix.artifact }} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  build-macos:
    name: Build – ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: symphony.darwin-x64.node

          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: symphony.darwin-arm64.node

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.target }})
        run: npm run build -- --target ${{ matrix.target }}

      - name: Strip binary
        run: strip ${{ matrix.artifact }} 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts into npm/ packages
        run: npx napi artifacts --dir artifacts --dist npm

      - name: Compile TypeScript
        run: tsc -p tsconfig.json

      - name: Set optionalDependencies in package.json
        run: npx napi prepublish -t npm --skip-gh-release

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --provenance --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
