[package]
name = "symphony"
version = "0.3.0"
edition = "2021"
license = "Elastic-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2.16", features = ["napi4", "tokio_rt", "async"] }
napi-derive = "2.16"
tokio       = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
rustls      = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile   = "2.1"
rustls-pki-types = "1.7"
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
arc-swap    = "1.7"
dashmap     = "6"
ipnetwork   = "0.20"
thiserror   = "1.0"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc        = "0.2"
socket2     = { version = "0.5", features = ["all"] }
ring        = "0.17"
md-5        = "0.10"
zeroize     = "1"
maxminddb = "0.29.0"
ip_network_table = "0.2.0"
ip_network = "0.4.1"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = 3

[dev-dependencies]
maxminddb-writer = "0.1.2"
serde = { version = "1", features = ["derive"] }
